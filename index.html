<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished GitHub Pages test site." />
    <meta name="theme-color" content="#0f172a" />
    <title>External Test Site</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, #1d4ed8 0, transparent 32rem),
          radial-gradient(circle at 85% 85%, #7c3aed 0, transparent 28rem),
          #0f172a;
      }

      main {
        width: min(100% - 2rem, 48rem);
        padding: clamp(2rem, 6vw, 4.5rem);
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 1.5rem;
        background: rgb(15 23 42 / 72%);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 30%);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        display: inline-flex;
        gap: .5rem;
        align-items: center;
        margin: 0 0 1.25rem;
        color: #93c5fd;
        font-size: .9rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .status {
        width: .6rem;
        height: .6rem;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 0 .3rem rgb(52 211 153 / 15%);
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -.06em;
      }

      p {
        max-width: 54ch;
        margin: 1.5rem 0 0;
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        margin-top: 2.5rem;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 1rem;
        background: rgb(255 255 255 / 12%);
      }

      .details div {
        padding: 1rem;
        background: rgb(15 23 42 / 85%);
      }

      strong, span { display: block; }
      strong { color: #f8fafc; font-size: 1.1rem; }
      span { margin-top: .25rem; color: #94a3b8; font-size: .8rem; }

      @media (max-width: 34rem) {
        .details { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><i class="status"></i> GitHub Pages</p>
      <h1>Ready for external testing.</h1>
      <p>
        This responsive landing page is deployed automatically from the repository
        and provides a clean, reliable endpoint for sharing and validation.
      </p>
      <section class="details" aria-label="Site status">
        <div><strong>Online</strong><span>Deployment configured</span></div>
        <div><strong>Responsive</strong><span>Built for every screen</span></div>
        <div><strong>Secure</strong><span>Served over HTTPS</span></div>
      </section>
    </main>
  </body>
</html>
