<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EQ Curve</title>
  <meta name="description" content="Interactive prototype of the PerL 2 10-band Advanced EQ: board Options 1–3.">
  <meta name="theme-color" content="#20212a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=fullscreen-app">
</head>
<body>
<main class="page">
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="abs sheet-back"></div>
      <div class="abs sheet"></div>
      <div class="abs notch"></div>
      <div class="abs time">9:41</div>
      <div class="abs sb-right" aria-hidden="true">
        <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><g fill="#fff"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2C13.3 1.6 10.8.6 8 .6S2.7 1.6.8 3.5L2 4.7C3.6 3.2 5.7 2.3 8 2.3z"/><path d="M8 5.7c1.4 0 2.6.5 3.6 1.4l1.2-1.2C11.5 4.7 9.8 4 8 4s-3.5.7-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4z"/><path d="M8 9.1c.5 0 1 .2 1.3.5L8 11 6.7 9.6c.3-.3.8-.5 1.3-.5z"/></g></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="14" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="rgba(255,255,255,.45)"/></svg>
      </div>
      <div class="abs titlebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d6d6d9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
        <span style="flex:1"></span>
        <h2 class="eq-title" id="eqTitle" tabindex="0" role="button" aria-haspopup="menu" aria-expanded="false" title="Press and hold to switch option">Advanced EQ</h2>
        <span style="flex:1"></span>
        <span style="width:24px;height:24px" aria-hidden="true"></span>
      </div>
      <div class="abs tags" role="group" aria-label="Presets">
        <button class="tag" id="tag-true-sound" data-preset="true-sound" aria-pressed="false">True sound</button>
        <button class="tag" id="tag-custom" data-preset="custom" aria-pressed="false">Custom</button>
        <button class="tag" id="tag-classical" data-preset="classical" aria-pressed="true">Classical</button>
      </div>

      <div class="abs card" id="card"></div>
      <div class="abs faders" id="faders" hidden></div>

      <div class="abs edit-row" id="editRow" inert>
        <button class="ghost" id="saveBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Save
        </button>
        <button class="ghost" id="revertBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>Revert
        </button>
      </div>
      <button class="abs manage" id="manageBtn">Manage preset</button>
      <div class="abs toast" id="toast" role="status" aria-live="polite"></div>
      <div class="abs menu-scrim" id="menuScrim" hidden></div>
      <div class="abs opt-menu" id="optMenu" role="menu" aria-label="Board option" inert>
        <p>Board option</p>
        <button type="button" role="menuitemradio" data-layout="option-1" aria-checked="true"><span class="txt"><b>Option 1</b><span>Curve, dB scale</span></span>
          <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6c57b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <button type="button" role="menuitemradio" data-layout="option-2" aria-checked="false"><span class="txt"><b>Option 2</b><span>Curve, wider</span></span>
          <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6c57b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <button type="button" role="menuitemradio" data-layout="option-3" aria-checked="false"><span class="txt"><b>Option 3</b><span>Slim faders</span></span>
          <svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6c57b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
      <div class="abs home"></div>
    </div>
  </div>
</main>

<script src="app.js?v=fullscreen-app"></script>
</body>
</html>
